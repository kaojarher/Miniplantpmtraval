<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浮槎紀・原型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d2230;--fg:#f1ecdc;--dim:#a9bcc0;--panel:rgba(9,28,40,.74);--line:rgba(241,236,220,.22);--jade:#7ee0c0;--gold:#f0c668;--red:#ff7a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#dcebe6;--fg:#12302f;--dim:#41615f;--panel:rgba(246,250,246,.82);--line:rgba(18,48,47,.25);--jade:#0b7a5e;--gold:#8a5a00;--red:#b3261e;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0d2230}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;touch-action:none;user-select:none}
#c{position:fixed;inset:0}
.p{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.55;backdrop-filter:blur(6px)}
#card{top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;max-width:48vw}
#card b{font-size:15px;color:var(--jade)}
#card span{color:var(--dim)}
#st{top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;text-align:right}
#bar{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--jade)}
#fu{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);width:min(88vw,420px);text-align:center;transition:opacity .4s}
#go{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:94vw}
#go button{padding:8px 10px;font-size:13px}
button{font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:transparent;border:1px solid var(--jade);border-radius:8px;padding:9px 16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:active{background:var(--jade);color:var(--bg)}
#q{top:calc(env(safe-area-inset-top,0px) + 74px);left:8px;max-width:48vw}
#q em{font-style:normal;color:var(--gold)}
#arrow{left:0;top:0;text-align:center;width:64px;display:none;pointer-events:none}
#ai{font-size:30px;line-height:1;color:var(--gold)}
#ad{font-size:12px;color:var(--dim)}
#dlg{left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);display:none;z-index:5}
#dlg .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#dlg{max-height:86vh;overflow-y:auto;touch-action:pan-y}
#g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.cell{height:64px;font-size:28px;padding:0}
#fbar{position:relative;height:22px;border:1px solid var(--line);border-radius:6px;margin:10px 0}
#fz{position:absolute;top:0;height:100%;background:var(--jade);opacity:.5}
#fm{position:absolute;top:0;width:6px;height:100%;background:var(--gold)}
#mei{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);display:flex;align-items:flex-end;gap:6px;z-index:4}
#mb{font-size:30px;line-height:1;padding:5px 8px;border-radius:50%;background:var(--panel);animation:fl 2s ease-in-out infinite}
#mt{position:static;display:none;font-size:13px;max-width:52vw}
@keyframes fl{50%{transform:translateY(-5px)}}
#dlg input{user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx" style="position:fixed;inset:0;pointer-events:none"></canvas>
<div class="p" id="card"></div>
<div class="p" id="st"></div>
<div class="p" id="q"></div>
<div class="p" id="arrow"><div id="ai">▲</div><div id="ad"></div></div>
<div class="p" id="fu"></div>
<div class="p" id="go"><button id="daily">每日挑戰</button><button id="jr">手札</button><button id="yard">練製</button><button id="mu">音效：開</button><button id="sail">解纜・前往下一顆星</button></div>
<div id="mei"><button id="mb" aria-label="魅兒導覽">🧚</button><div class="p" id="mt"></div></div>
<div class="p" id="dlg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const N={aura:['稀薄','貧瘠','普通','充沛','濃郁','狂暴'],land:['山水','荒漠','冰原','雲海浮島','古林'],power:['無主散修','商會坊市','劍修宗門','煉器世家','妖族聚落','魔修殘黨'],crisis:['靈潮暴走','妖獸圍城','心魔瘴氣','靈槎失控','資源爭奪','上古禁制'],boon:['靈藥','礦脈','古劍遺蹟','洞府傳承','靈獸蛋','秘境地圖'],sky:['長晝','長夜','雙月','靈雨','罡風','極光']};
const REALM=['引靈','聚元','凝脈','築基','結丹','化嬰','御虛','通玄','歸真'],TH=[0,60,150,260,400,580,800,1050,1350,1e9];
const GROUND=[0x62b46f,0xdca85e,0xc3e6f2,0xd5daf0,0x37895d],SKY=[0x86c9e8,0xf2c690,0x9fbdd8,0xb9c6f2,0x4a7c69];
const NAMES=['青嵐','赤砂','凝霜','雲渺','幽篁','靈淵','落星','白瀾','玄圃','栖霞'];
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function roll(seed){
  if(seed===1)return{aura:3,land:0,power:1,crisis:4,boon:0,sky:3};
  const R=mb(seed),d=()=>Math.floor(R()*6);
  const r={aura:d(),land:Math.floor(R()*5),power:d(),crisis:d(),boon:d(),sky:d()};
  for(let i=0;i<30;i++){
    if(r.crisis==0&&r.aura<2)r.crisis=d();
    else if(r.aura==5&&r.power==0)r.power=d();
    else if(r.land==1&&r.sky==3)r.sky=d();
    else if(r.land==2&&r.sky==0)r.sky=d();
    else if(r.land==3&&r.boon==1)r.boon=d();
    else break;
  }
  return r;
}
let S={stones:120,xp:0,visited:0,hull:0,sail:0,comp:0};
try{const s=JSON.parse(localStorage.getItem('fucha')||'null');if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem('fucha',JSON.stringify(S))}catch(e){}}

const R0=100,P=new THREE.Vector3(0,R0,0);
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,75);
cam.position.set(0,R0+8,9);cam.lookAt(0,R0-.5,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x405060,.95));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(6,12,8);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const hero=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.28,.36,.9,10),new THREE.MeshLambertMaterial({color:0xf1ecdc}));body.position.y=.45;
const head=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),new THREE.MeshLambertMaterial({color:0xffd9b0}));head.position.y=1.1;
const hat=new THREE.Mesh(new THREE.ConeGeometry(.4,.35,10),new THREE.MeshLambertMaterial({color:0x2f6f66}));hat.position.y=1.42;
hero.add(xian(0xf1ecdc,0x2f6f66,0x1b1b22,0xf0c668));hero.scale.setScalar(.8);hero.position.copy(P);scene.add(hero);

let moons=[],planet=null,items=[],seed=1,info=null,herbs=0,crisisLeft=0,done=false,tArrive=0;
const up=new THREE.Vector3(0,1,0);
function place(m,dir,lift){m.position.copy(dir).multiplyScalar(R0+(lift||0));m.quaternion.setFromUnitVectors(up,dir);planet.add(m)}
function rdir(R,minY,maxY){let v;do{const u=R()*2-1,t=R()*6.2832,s=Math.sqrt(1-u*u);v=new THREE.Vector3(s*Math.cos(t),u,s*Math.sin(t))}while(v.y>maxY||v.y<minY);return v}
function deco(R,land){
  const g=new THREE.Group(),c=(h)=>new THREE.MeshLambertMaterial({color:h,flatShading:true});
  if(land==1){const a=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,1.2+R()*.8,6),c(0xb8774a));a.position.y=.7;g.add(a)}
  else if(land==2){const a=new THREE.Mesh(new THREE.OctahedronGeometry(.5+R()*.4),c(0x8fd4ee));a.scale.y=1.8;a.position.y=.8;g.add(a)}
  else if(land==3){const a=new THREE.Mesh(new THREE.SphereGeometry(.6+R()*.4,8,6),c(0xffffff));a.scale.y=.6;a.position.y=.5;g.add(a)}
  else{const h=1.4+R()*1.6,a=new THREE.Mesh(new THREE.ConeGeometry(.6,h,7),c(land==4?0x1f5f43:0x3f9a55));a.position.y=h/2+.2;g.add(a)}
  return g;
}
function marker(color,r){return new THREE.Mesh(new THREE.OctahedronGeometry(r),new THREE.MeshBasicMaterial({color}))}

function build(sd,first){
  seed=sd;info=roll(sd);nextSeed=Math.floor(Math.random()*9000)+2;herbs=0;done=false;tArrive=performance.now();
  if(planet)scene.remove(planet);moons.forEach(m=>scene.remove(m));moons=[];mons=[];bullets.forEach(b=>scene.remove(b.m));bullets=[];
  planet=new THREE.Group();scene.add(planet);
  const R=mb(sd*7+3),geo=new THREE.IcosahedronGeometry(R0,24),pos=geo.attributes.position,col=[],base=new THREE.Color(GROUND[info.land]);
  for(let i=0;i<pos.count;i+=3){const k=.88+R()*.2,c=base.clone().multiplyScalar(k);for(let j=0;j<3;j++)col.push(c.r,c.g,c.b)}
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  planet.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));
  for(let i=0;i<900;i++){const g=deco(R,info.land);place(g,rdir(R,-1,.995),0);g.rotateY(R()*6)}
  const tw=new THREE.Mesh(new THREE.CylinderGeometry(.5,.9,3.6,6),new THREE.MeshLambertMaterial({color:0xe9dcc0,flatShading:true}));tw.position.y=1.8;
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.1,.9,6),new THREE.MeshLambertMaterial({color:0xb4453a}));roof.position.y=4;
  const lm=new THREE.Group();lm.add(tw,roof);place(lm,rdir(R,.85,.99),0);
  items=[];accepted=false;
  {const np=new THREE.Group(),nb=new THREE.Mesh(new THREE.ConeGeometry(.5,1.4,8),new THREE.MeshLambertMaterial({color:0x8a5fd0})),nh=new THREE.Mesh(new THREE.SphereGeometry(.3,10,8),new THREE.MeshLambertMaterial({color:0xffd9b0}));nb.position.y=.7;nh.position.y=1.6;np.add(xian(0x8a5fd0,0xf0c668,0xe8e8ee,0xb0b0c0));np.scale.setScalar(.85);place(np,rdir(R,.96,.995),0);items.push({m:np,t:'npc'})}
  genQuests(R);parts=0;fixed=false;
  {const pg=new THREE.Group(),L=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true}),ring=new THREE.Mesh(new THREE.TorusGeometry(2.2,.35,8,20),L(0x777f86));ring.position.y=2.6;pg.add(ring);
   [-2.2,2.2].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,2.6,6),L(0x9a9aa0));p.position.set(x,1.3,0);pg.add(p)});
   place(pg,rdir(R,.9,.985),0);items.push({m:pg,t:'portal',ring});
   for(let i=0;i<3;i++){const m=marker(0x6aa8ff,.38);place(m,rdir(R,.8,.997),1);items.push({m,t:'part'})}}
  town(R,info.power);
  for(let i=0;i<5;i++){const m=marker(0x7ee0c0,.32);place(m,rdir(R,.8,.997),.9);items.push({m,t:'herb'})}
  const ch=marker(0xf0c668,.5);place(ch,rdir(R,.8,.99),1);items.push({m:ch,t:'chest'});
  crisisN=crisisLeft=Math.max(2,CR[info.crisis][1]-(S.hull>>1));crT=0;crFail=false;for(let i=0;i<crisisN;i++){const m=marker(0xff5c4d,.4);place(m,rdir(R,.85,.997),1.1);items.push({m,t:'bad',k:i})}
  const night=info.sky==1||info.sky==2;
  const sk=new THREE.Color(SKY[info.land]);if(night)sk.multiplyScalar(.28);
  scene.background=sk;scene.fog=new THREE.Fog(sk,25,62);
  if(info.sky==2){[[-20,R0+28,-40,3],[22,R0+34,-50,2]].forEach(a=>{const m=new THREE.Mesh(new THREE.SphereGeometry(a[3],16,12),new THREE.MeshBasicMaterial({color:0xfff4cc,fog:false}));m.position.set(a[0],a[1],a[2]);scene.add(m);moons.push(m)})}
  ui();
  const nm=NAMES[(sd*3)%NAMES.length]+'星';
  info.name=sd===1?'青嵐星':nm;S.log=(S.log||[]);if(!S.log.some(l=>l.seed==sd)){S.log.push({seed:sd,name:info.name});S.log=S.log.slice(-8);save()}
  ui();
  msg(first?'魅兒：歡迎上槎！青綠色的是靈材，金色是機緣，紅色是瘴球，紫衣人是委託人，藍色陣石集滿三個可修復渡口。角色會自動射擊靠近的猛獸。用方向鍵、WASD 或拖曳螢幕移動，畫面邊緣的金色箭頭會指向最近的目標。':'魅兒：靠岸了，先看左上角的生成卡，再決定要先採集還是先化解危機。');
}
function lvl(){let i=0;while(S.xp>=TH[i+1])i++;return i}
function ui(){
  if(!info)return;const l=lvl();
  $('card').innerHTML='<b>'+(info.name||'')+'</b> <span>S-'+String(seed).padStart(4,'0')+'</span><br><span>靈氣</span>'+N.aura[info.aura]+'・'+N.land[info.land]+'<br><span>勢力</span>'+N.power[info.power]+'<br><span>危機</span>'+N.crisis[info.crisis]+'<br><span>機緣</span>'+N.boon[info.boon]+'・'+N.sky[info.sky];
  $('st').innerHTML=(S.hero?'<b>'+esc(S.hero.name)+'</b><br>':'')+'靈石 '+S.stones+'<br>吸星劍・'+SW[lvl()>>1]+'<br>劍刃 '+GN[S.wpn||0]+'・護具 '+GN[S.arm||0]+'<br>紫焰心 '+FL[S.fl||1]+'・隊友 '+(S.party||[]).length+'/3<br>氣血 <span id="hp">'+Math.ceil(php)+'</span>/100<br>境界：'+REALM[l]+'<div id="bar"><i style="width:'+Math.min(100,(S.xp-TH[l])/(TH[l+1]-TH[l])*100)+'%"></i></div>';
  $('q').innerHTML=(accepted?'委託：'+NPC[info.power][0]+'<br>':'')+'採集'+N.boon[info.boon]+' <em>'+herbs+'/5</em><br>'+CR[info.crisis][3]+' <em>'+(crFail?'失敗':(crisisN-crisisLeft)+'/'+crisisN)+'</em><span id="ct"></span>'+'<br>修復渡口 <em>'+(fixed?'完成':parts+'/3')+'</em>'+(daily?'<br>每日挑戰 <span id="dt"></span>':'')+(done?'<br>任務完成':'')+questTxt();
  const cost=fare();const pv=(()=>{const r=roll(nextSeed),a=[];if(S.comp>0)a.push('靈氣'+N.aura[r.aura]);if(S.comp>1)a.push(N.land[r.land]);if(S.comp>2)a.push(N.crisis[r.crisis]);return a.join('・')})();$('sail').textContent='解纜・'+(cost?cost+' 靈石':'免費')+(pv?'（前方：'+pv+'）':'');
}
function fare(){return S.visited==0||fixed?0:Math.max(0,50+(info?info.aura*10:0)-S.sail*8)}
let mt;function msg(t){const f=$('fu');f.textContent=t;f.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>f.style.opacity=.0,5200)}
function gain(xp,st){snd('get');const mul=1+info.aura*.2;xp=Math.round(xp*mul*(buffT>0?1.5:1)*(has(5)?1.2:1));st=Math.round(st*mul*(has(1)?1.2:1));const b=lvl();S.xp+=xp;S.stones+=st;if(lvl()>b){snd('up');msg('突破！你踏入「'+REALM[lvl()]+'」境。')}save();ui()}

const NPC=[['迷途散修','我的藥簍被妖獸叼走了，能幫我採齊靈材嗎？'],['坊市掌櫃','近來靈材被搶得兇，替我採齊五份，價錢好說。'],['守劍老修士','此地劍氣紊亂，先採靈材穩住劍心吧。'],['煉器師','火候不到，不收。去採靈材，再回來煉丹。'],['妖族長老','靈氣不穩，採些靈材安撫族人。'],['隱世高人','你身上有旅人的味道。採靈材，順便化解瘴氣。']];
let busy=false,accepted=false,npcCD=0;
function dlg(h,btns){busy=true;const d=$('dlg');d.innerHTML=h+'<div class="r"></div>';d.style.display='block';const r=d.querySelector('.r');btns.forEach(b=>{const e=document.createElement('button');e.textContent=b[0];e.onclick=b[1];r.appendChild(e)});return d}
function shut(){$('dlg').style.display='none';busy=false;npcCD=performance.now()+4000}
function talk(){const n=NPC[info.power];dlg('<b>【主線】'+n[0]+'・'+PN[seed%12]+'</b><br>'+n[1]+'<br><span style="color:var(--dim)">危機：'+CR[info.crisis][3]+'，共 '+crisisN+' 處（'+RL[info.crisis]+'）'+(CR[info.crisis][2]?'，限時 '+CR[info.crisis][2]+' 秒':'')+'。</span>',[[accepted?'已接任務':'接下任務',()=>{accepted=true;ui();shut()}],['採藥小遊戲',pick],['煉丹小遊戲',alch],['煉器小遊戲',forge],[has(info.power)?'辭別隊友':'邀請同行（60 靈石）',recruit],['離開',shut]])}
function pick(){let sc=0,t=0,cell=-1,kind=0;const d=dlg('採藥：點靈草，避開毒草（約 15 秒）<br>分數 <span id="sc">0</span><div id="g"></div>',[]);const g=d.querySelector('#g');
  const cs=[...Array(9)].map((_,i)=>{const b=document.createElement('button');b.className='cell';b.onclick=()=>{if(cell!=i)return;sc+=kind?-1:1;cell=-1;b.textContent='';d.querySelector('#sc').textContent=sc};g.appendChild(b);return b});
  const iv=setInterval(()=>{if(cell>=0)cs[cell].textContent='';cell=Math.floor(Math.random()*9);kind=Math.random()<.25?1:0;cs[cell].textContent=kind?'☠':'🌿';if(++t>=22){clearInterval(iv);const ok=sc>=8;if(ok)gain(sc*3,sc*6);dlg((ok?'採藥成功':'再接再厲')+'：'+sc+' 分',[['好',shut]])}},700)}
function alch(){let hit=0,rd=0,x=0,dir=1,zone=.5,sp=.012;const d=dlg('煉丹：綠區內按下「收火」（共 3 輪）<div id="fbar"><div id="fz"></div><div id="fm"></div></div><span id="fr"></span>',[['收火',()=>{const ok=Math.abs(x-zone)<.12;if(ok)hit++;rd++;d.querySelector('#fr').textContent=(ok?'火候剛好':'火候不到')+'（'+hit+'/'+rd+'）';next()}]]);
  function next(){if(rd>=3){clearInterval(iv);const ok=hit>=2;if(ok){gain(hit*20,hit*30);qEv('alch',1)}dlg(ok?'丹成！成功 '+hit+' 次。':'丹毀了……再試一次吧。',[['好',shut]]);return}zone=.15+Math.random()*.7;sp=.012+rd*.006;d.querySelector('#fz').style.cssText='left:'+(zone-.12)*100+'%;width:24%'}
  const iv=setInterval(()=>{x+=dir*sp;if(x>1||x<0)dir*=-1;const m=d.querySelector('#fm');if(m)m.style.left=Math.max(0,Math.min(1,x))*100+'%'},16);next()}

const GN=['無','凡品','精煉','上品','極品'];if(S.gear&&S.wpn===undefined){S.wpn=S.gear;delete S.gear}
